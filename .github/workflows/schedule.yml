name: 地緣政治雷達自動排程

on:
  schedule:
    # 這裡設定時間 (UTC 時間)。目前的設定是「每 4 小時執行一次」。
    # 你可以依照需求修改，例如 0 */2 * * * 是每 2 小時。
    - cron: '0 */4 * * *'
  
  workflow_dispatch:
    # 加上這個設定，讓你可以隨時在 GitHub 網頁上手動點擊「立即測試運行」

jobs:
  run-radar:
    runs-on: ubuntu-latest
    
    steps:
    - name: 取得程式碼
      uses: actions/checkout@v3

    - name: 設定 Python 環境
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: 安裝所需套件
      run: pip install -r requirements.txt

    - name: 執行 AI 巡邏程式
      env:
        # 將 GitHub Secrets 注入為環境變數給程式使用
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
      run: python scheduled_run.py
